<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pikol Castle — header</title>
  </head>
  <body>
    <!-- Shared navigation and its buttons. Keep data-action attributes when editing button labels. -->
    <header
      class="fixed top-0 inset-x-0 z-50 transition-all duration-300 border-b bg-transparent border-transparent"
      id="site-header"
    >
      <nav
        aria-label="Main navigation"
        class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 h-16 sm:h-18"
      >
        <a href="#home" class="flex items-center gap-2.5 group" aria-label="Pikol Castle home"
          ><div
            class="relative w-10 h-10 sm:w-11 sm:h-11 shrink-0 rounded-full bg-black ring-1 ring-primary/40 overflow-hidden flex items-center justify-center group-hover:ring-primary/80 transition-all"
          >
            <img
              alt="Pikol Castle logo"
              width="44"
              height="44"
              decoding="async"
              class="object-contain scale-125"
              src="assets/images/logo.png"
              style="color: transparent"
            />
          </div>
          <span class="font-extrabold tracking-wide text-base sm:text-lg"
            >PIKOL <span class="text-primary">CASTLE</span></span
          ></a
        >
        <div class="hidden lg:flex items-center gap-1">
          <a href="#home" class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors">Home</a>
          <a
            href="#courts"
            class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors"
            >Courts</a
          ><a
            href="#booking"
            class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors"
            >Book a Court</a
          ><a
            href="#locate-us"
            class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors"
            >Locate Us</a
          >
        </div>
        <div class="hidden lg:flex items-center gap-2">
          <button
            data-slot="button"
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive border bg-background shadow-xs dark:bg-input/30 dark:border-input dark:hover:bg-input/50 h-9 px-4 py-2 has-[&gt;svg]:px-3 gap-1.5 font-semibold border-primary/50 text-primary hover:bg-primary/10 hover:text-primary"
            type="button"
            data-action="login"
            data-auth-control="true"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-log-in w-4 h-4"
              aria-hidden="true"
            >
              <path d="m10 17 5-5-5-5"></path>
              <path d="M15 12H3"></path>
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></svg
            >Log in</button
          ><button
            data-slot="button"
            class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive shadow-xs h-9 px-4 py-2 has-[&gt;svg]:px-3 bg-primary text-primary-foreground font-semibold hover:bg-primary/90 gap-2"
            type="button"
            data-action="book"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-calendar-days w-4 h-4"
              aria-hidden="true"
            >
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
              <path d="M8 14h.01"></path>
              <path d="M12 14h.01"></path>
              <path d="M16 14h.01"></path>
              <path d="M8 18h.01"></path>
              <path d="M12 18h.01"></path>
              <path d="M16 18h.01"></path></svg
            >Book Now
          </button>
        </div>
        <button
          class="lg:hidden p-2 rounded-md text-foreground hover:bg-secondary/70 transition-colors min-w-[44px] min-h-[44px] flex items-center justify-center"
          aria-label="Open menu"
          aria-expanded="false"
          type="button"
          data-action="menu"
          aria-controls="mobile-menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-menu w-6 h-6"
            aria-hidden="true"
          >
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
            <path d="M4 6h16"></path>
          </svg>
        </button>
      </nav>
      <div id="mobile-menu" hidden="" class="lg:hidden border-t border-border/60 bg-background/95 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-1">
          <a href="#home" class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors">Home</a>
          <a
            href="#courts"
            class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors"
            >Courts</a
          ><a
            href="#booking"
            class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors"
            >Book a Court</a
          ><a
            href="#locate-us"
            class="px-3 py-2 rounded-md text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-secondary/70 transition-colors"
            >Locate Us</a
          >
          <div class="flex gap-2 pt-3">
            <button type="button" data-action="login" class="btn btn-outline flex-1" data-auth-control="true">
              Log in</button
            ><button type="button" data-action="book" class="btn btn-primary flex-1">Book Now</button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
