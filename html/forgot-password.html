<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pikol Castle - Reset password</title></head><body><template id="template-forgot"><div class="auth-dialog reset-dialog" role="dialog" aria-labelledby="forgot-title" tabindex="-1"><div class="auth-banner"><div class="court-pattern auth-banner-pattern" aria-hidden="true"></div><button type="button" class="auth-close" data-action="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="auth-brand"><img src="assets/images/logo.png" alt="Pikol Castle" width="72" height="72"></div><div class="auth-body"><div class="auth-heading"><h2 id="forgot-title">Forgot your password?</h2><p id="reset-description">A few quick steps to get you back on court.</p></div><ol class="reset-stepper" aria-label="Password reset progress"><li data-reset-step="1" aria-current="step"><b>1</b><span>Email</span></li><li data-reset-step="2"><b>2</b><span>Verify code</span></li><li data-reset-step="3"><b>3</b><span>New password</span></li></ol><form id="reset-password-form"><div id="reset-fields"><div class="auth-field"><label for="forgot-email">Email address</label><div class="auth-control"><input id="forgot-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="150" required></div></div></div><p class="form-error" role="alert" hidden></p><button class="auth-submit" type="submit">Send reset code</button><div id="reset-secondary"></div></form><p class="auth-switch"><button class="auth-link" type="button" data-action="auth-view" data-view="login">Back to log in</button></p></div></div></template></body></html>
