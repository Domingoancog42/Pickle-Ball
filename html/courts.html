<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pikol Castle</title>
  </head>
  <body>
    <section id="courts" aria-label="Our courts" class="py-20 sm:py-24">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center max-w-2xl mx-auto mb-12">
          <p class="text-primary font-bold tracking-widest uppercase text-sm mb-3">The Courts</p>
          <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Two Battlegrounds. One Castle.</h2>
          <p class="mt-4 text-muted-foreground">
            Every court is built to tournament spec — cushioned surfaces, pro nets and lighting that keeps the game
            sharp from first serve to match point.
          </p>
        </div>
        <div class="grid gap-6" data-court-grid tabindex="0" role="region" aria-label="Courts — swipe left or scroll horizontally to see more">
          <div>
            <div
              data-slot="card"
              data-court-id="3"
              class="text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm overflow-hidden border-border/70 bg-card hover:border-primary/50 transition-all duration-300 group h-full"
            >
              <div class="relative aspect-[16/9] overflow-hidden">
                <img
                  alt="Night Watch — LED Arena"
                  loading="lazy"
                  decoding="async"
                  class="object-cover transition-transform duration-500 group-hover:scale-105"
                  src="assets/images/court-night.png"
                  style="position: absolute; height: 100%; width: 100%; inset: 0px; color: transparent"
                />
                <div class="absolute inset-0 bg-gradient-to-t from-card via-transparent to-transparent"></div>
                <span
                  data-slot="badge"
                  data-court-type
                  class="inline-flex items-center justify-center rounded-md px-2 py-0.5 text-xs w-fit whitespace-nowrap shrink-0 [&amp;&gt;svg]:size-3 gap-1 [&amp;&gt;svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive transition-[color,box-shadow] overflow-hidden [a&amp;]:hover:bg-accent [a&amp;]:hover:text-accent-foreground absolute top-3 left-3 bg-background/80 backdrop-blur-sm text-primary border border-primary/40 font-semibold"
                  >Indoor</span
                >
                <div
                  class="absolute bottom-3 right-3 bg-background/85 backdrop-blur-sm rounded-lg px-3 py-1.5 border border-border/70"
                >
                  <span data-court-rate class="text-primary font-extrabold">₱550</span
                  ><span class="text-xs text-muted-foreground">/hr</span>
                </div>
              </div>
              <div data-slot="card-content" class="p-6">
                <h3 data-court-name class="text-xl font-bold group-hover:text-primary transition-colors">
                  Night Watch — LED Arena
                </h3>
                <p class="mt-1 text-sm text-muted-foreground" data-court-surface>Indoor</p>
                <button
                  data-slot="button"
                  class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive shadow-xs h-9 px-4 py-2 has-[&gt;svg]:px-3 mt-5 w-full sm:w-auto bg-primary/15 text-primary border border-primary/40 hover:bg-primary hover:text-primary-foreground font-semibold gap-2"
                  type="button"
                  data-action="court"
                  data-court="0"
                >
                  Book this court<svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-arrow-right w-4 h-4"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div>
            <div
              data-slot="card"
              data-court-id="4"
              class="text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm overflow-hidden border-border/70 bg-card hover:border-primary/50 transition-all duration-300 group h-full"
            >
              <div class="relative aspect-[16/9] overflow-hidden">
                <img
                  alt="The Armory — Training Court"
                  loading="lazy"
                  decoding="async"
                  class="object-cover transition-transform duration-500 group-hover:scale-105"
                  src="assets/images/court-training.png"
                  style="position: absolute; height: 100%; width: 100%; inset: 0px; color: transparent"
                />
                <div class="absolute inset-0 bg-gradient-to-t from-card via-transparent to-transparent"></div>
                <span
                  data-slot="badge"
                  data-court-type
                  class="inline-flex items-center justify-center rounded-md px-2 py-0.5 text-xs w-fit whitespace-nowrap shrink-0 [&amp;&gt;svg]:size-3 gap-1 [&amp;&gt;svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive transition-[color,box-shadow] overflow-hidden [a&amp;]:hover:bg-accent [a&amp;]:hover:text-accent-foreground absolute top-3 left-3 bg-background/80 backdrop-blur-sm text-primary border border-primary/40 font-semibold"
                  >Indoor</span
                >
                <div
                  class="absolute bottom-3 right-3 bg-background/85 backdrop-blur-sm rounded-lg px-3 py-1.5 border border-border/70"
                >
                  <span data-court-rate class="text-primary font-extrabold">₱300</span
                  ><span class="text-xs text-muted-foreground">/hr</span>
                </div>
              </div>
              <div data-slot="card-content" class="p-6">
                <h3 data-court-name class="text-xl font-bold group-hover:text-primary transition-colors">
                  The Armory — Training Court
                </h3>
                <p class="mt-1 text-sm text-muted-foreground" data-court-surface>Indoor</p>
                <button
                  data-slot="button"
                  class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm transition-all disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg:not([class*='size-'])]:size-4 shrink-0 [&amp;_svg]:shrink-0 outline-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive shadow-xs h-9 px-4 py-2 has-[&gt;svg]:px-3 mt-5 w-full sm:w-auto bg-primary/15 text-primary border border-primary/40 hover:bg-primary hover:text-primary-foreground font-semibold gap-2"
                  type="button"
                  data-action="court"
                  data-court="1"
                >
                  Book this court<svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-arrow-right w-4 h-4"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m12 5 7 7-7 7"></path>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
