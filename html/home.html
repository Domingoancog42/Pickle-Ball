<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pikol Castle</title></head><body>

    <div class="relative w-40 sm:w-52 h-40 sm:h-52 mb-6"><img alt="Pikol Castle logo" src="assets/images/logo.png" class="object-contain" style="position:absolute;height:100%;width:100%;inset:0"></div>

    <div class="mt-8 flex flex-col sm:flex-row gap-3 sm:gap-4"><button type="button" data-slot="button" class="btn btn-primary h-12 px-8 font-bold teal-glow-box" data-action="book">Book a Court</button><button type="button" data-slot="button" class="btn btn-outline h-12 px-8 font-semibold" data-action="courts">Explore Courts</button></div>
    <div class="mt-6 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-muted-foreground"><a href="#locate-us" class="inline-flex items-center gap-2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="w-4 h-4 text-primary" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><strong>KIBAGHOT, LAGUINDINGAN, MISAMIS ORIENTAL, 9019</strong></a></div>

  </div></div>
</section></body></html>
